services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: fabric_ppc
      MYSQL_USER: fabric
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "33306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "63790:6379"
volumes:
  mysql-data:
